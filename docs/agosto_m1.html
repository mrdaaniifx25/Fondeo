<title>Agosto en M1</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme: light;
  --fondo:#f2f5f8; --panel:#fdfdfe; --panel2:#f6f8fb;
  --tinta:#12161c; --tinta2:#4e5864; --tinta3:#8b95a1;
  --linea:#dde3ea; --linea2:#eaeff4;
  --s1:#2a78d6; --s2:#eb6834; --ok:#0ca30c; --mal:#d03b3b;
  --s1w:rgba(42,120,214,.10);
  --sombra:0 1px 2px rgba(16,24,40,.05), 0 1px 3px rgba(16,24,40,.04);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  color-scheme: dark;
  --fondo:#10131a; --panel:#181c24; --panel2:#1d222b;
  --tinta:#f0f3f7; --tinta2:#aab4c0; --tinta3:#6b7683;
  --linea:#29303a; --linea2:#20262f;
  --s1:#3987e5; --s2:#d95926; --ok:#22b422; --mal:#e05555;
  --s1w:rgba(57,135,229,.13);
  --sombra:0 1px 2px rgba(0,0,0,.3);
}}
:root[data-theme="dark"]{
  color-scheme: dark;
  --fondo:#10131a; --panel:#181c24; --panel2:#1d222b;
  --tinta:#f0f3f7; --tinta2:#aab4c0; --tinta3:#6b7683;
  --linea:#29303a; --linea2:#20262f;
  --s1:#3987e5; --s2:#d95926; --ok:#22b422; --mal:#e05555;
  --s1w:rgba(57,135,229,.13);
  --sombra:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
body{background:var(--fondo); color:var(--tinta); margin:0;
  font-family:"IBM Plex Sans",system-ui,-apple-system,sans-serif; font-size:15px; line-height:1.5}
.env{max-width:1180px; margin:0 auto; padding-block:22px 56px;
  padding-left:16px; padding-right:16px}
h1{font-family:Archivo,system-ui,sans-serif; font-size:26px; font-weight:700;
  letter-spacing:-.025em; margin:0 0 4px}
.sub{color:var(--tinta2); font-size:14px; margin:0 0 18px; max-width:70ch}

.barra{display:flex; gap:7px; flex-wrap:wrap; margin-bottom:12px}
.barra button{font:inherit; font-family:"IBM Plex Mono",monospace; font-size:14px;
  font-weight:500; padding:8px 12px; border:1px solid var(--linea); border-radius:8px;
  background:var(--panel); color:var(--tinta2); cursor:pointer; position:relative}
.barra button[aria-pressed="true"]{background:var(--s1); border-color:var(--s1); color:#fff}
.barra button .pt{position:absolute; top:4px; right:5px; width:6px; height:6px;
  border-radius:50%; background:var(--s2)}
.barra button[aria-pressed="true"] .pt{background:#fff}

.caja{background:var(--panel); border:1px solid var(--linea); border-radius:11px;
  box-shadow:var(--sombra); overflow:hidden; margin-bottom:14px}
svg{display:block; width:100%; height:auto; touch-action:manipulation}

.mandos{display:flex; gap:8px; flex-wrap:wrap; align-items:center;
  padding:11px 14px; border-top:1px solid var(--linea2); background:var(--panel2)}
.mandos button{font:inherit; font-size:13.5px; font-weight:600; padding:8px 13px;
  border:1px solid var(--linea); border-radius:7px; background:var(--panel);
  color:var(--tinta); cursor:pointer}
.mandos button:hover{background:var(--linea2)}
.mandos button:disabled{opacity:.4; cursor:default}
.mandos .sep{flex:1}
.mandos .ayuda{font-size:12.5px; color:var(--tinta3)}

.lee{display:grid; grid-template-columns:repeat(auto-fit,minmax(118px,1fr)); gap:1px;
  background:var(--linea2)}
.lee > div{background:var(--panel); padding:11px 14px}
.lee .k{font-size:10.5px; letter-spacing:.06em; text-transform:uppercase;
  color:var(--tinta3); font-weight:600}
.lee .v{font-family:"IBM Plex Mono",monospace; font-size:17px; font-weight:600;
  font-variant-numeric:tabular-nums; margin-top:1px}
.pos{color:var(--ok)} .neg{color:var(--mal)} .ac{color:var(--s2)}

.ficha{padding:13px 16px; font-size:14px; color:var(--tinta2); line-height:1.6}
.ficha b{color:var(--tinta)}
.ficha .mono{font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--s1); outline-offset:2px}
</style>

<div class="env">
  <h1>Agosto en M1</h1>
  <p class="sub">Los quince días que tengo con datos, en minuto a minuto y hora de Madrid.
     Toca una vela para leer su precio exacto, y márcala si quieres enseñarme un nivel.</p>

  <div class="barra" id="dias"></div>

  <div class="caja">
    <svg id="g" viewBox="0 0 1120 560" preserveAspectRatio="xMidYMid meet"
         role="img" aria-label="Velas de un minuto del día seleccionado"></svg>
    <div class="mandos">
      <button type="button" id="b-min">Marcar el mínimo</button>
      <button type="button" id="b-max">Marcar el máximo</button>
      <button type="button" id="b-borra">Borrar marcas</button>
      <span class="sep"></span>
      <button type="button" id="b-zoom" aria-pressed="false">Ver sólo 08:00-11:30</button>
      <span class="ayuda">toca una vela</span>
    </div>
    <div class="lee" id="lee"></div>
  </div>

  <div class="caja"><div class="ficha" id="ficha"></div></div>
</div>

  }).join("");
}

function rango(D){
  var i0 = zoom ? Math.max(0, 480 - D.m0) : 0;
  var i1 = zoom ? Math.min(D.c.length, 690 - D.m0 + 1) : D.c.length;
  return [i0, i1];
}

function pinta(){
  var D = DIAS[iDia];
  var r = rango(D), i0 = r[0], i1 = r[1], n = i1 - i0;
  var lo = Infinity, hi = -Infinity;
  for (var i = i0; i < i1; i++){
    if (D.l[i] < lo) lo = D.l[i];
    if (D.h[i] > hi) hi = D.h[i];
  }
  if (D.aHi <= hi + 0.0012 && D.aHi >= lo - 0.0012) hi = Math.max(hi, D.aHi);
  if (D.aLo >= lo - 0.0012 && D.aLo <= hi + 0.0012) lo = Math.min(lo, D.aLo);
  var pad = (hi - lo) * 0.06 || 0.0005;
  lo -= pad; hi += pad;

  var pw = (W - ML - MR) / n;
  var X = function(i){ return ML + (i - i0 + 0.5) * pw; };
  var Y = function(v){ return MT + (hi - v) / (hi - lo) * (H - MT - MB); };
  var s = [];

  // ventana operativa
  var a = Math.max(i0, 480 - D.m0), b = Math.min(i1, 690 - D.m0 + 1);
  if (b > a) s.push('<rect x="' + X(a).toFixed(1) + '" y="' + MT + '" width="'
    + ((b-a)*pw).toFixed(1) + '" height="' + (H-MT-MB) + '" fill="var(--s1w)"/>');

  // rejilla y precios
  for (var k = 0; k <= 5; k++){
    var v = lo + (hi - lo) * k / 5, y = Y(v);
    s.push('<line x1="' + ML + '" y1="' + y.toFixed(1) + '" x2="' + (W-MR)
      + '" y2="' + y.toFixed(1) + '" stroke="var(--linea2)" stroke-width="1"/>');
    s.push('<text x="' + (W-MR+7) + '" y="' + (y+4).toFixed(1)
      + '" font-size="12" fill="var(--tinta3)" font-family="IBM Plex Mono, monospace">'
      + pr(v) + '</text>');
  }
  // horas
  for (var i = i0; i < i1; i++){
    var mn = D.m0 + i;
    if (mn % 30 === 0){
      s.push('<line x1="' + X(i).toFixed(1) + '" y1="' + MT + '" x2="' + X(i).toFixed(1)
        + '" y2="' + (H-MB) + '" stroke="var(--linea2)" stroke-width="1"/>');
      s.push('<text x="' + X(i).toFixed(1) + '" y="' + (H-MB+18)
        + '" font-size="12" fill="var(--tinta3)" text-anchor="middle"'
        + ' font-family="IBM Plex Mono, monospace">' + hm(mn) + '</text>');
    }
  }
  // velas
  var w = Math.max(1, pw * 0.68);
  for (var i = i0; i < i1; i++){
    var col = D.c[i] >= D.o[i] ? "var(--ok)" : "var(--mal)";
    var x = X(i);
    s.push('<line x1="' + x.toFixed(1) + '" y1="' + Y(D.h[i]).toFixed(1) + '" x2="'
      + x.toFixed(1) + '" y2="' + Y(D.l[i]).toFixed(1) + '" stroke="' + col
      + '" stroke-width="' + Math.max(0.7, pw*0.14).toFixed(2) + '"/>');
    var y0 = Y(Math.max(D.o[i], D.c[i])), y1 = Y(Math.min(D.o[i], D.c[i]));
    s.push('<rect x="' + (x - w/2).toFixed(1) + '" y="' + y0.toFixed(1) + '" width="'
      + w.toFixed(1) + '" height="' + Math.max(0.8, y1-y0).toFixed(1)
      + '" fill="' + col + '"/>');
  }
  // niveles de Asia
  [[D.aHi, "máximo de Asia"], [D.aLo, "mínimo de Asia"]].forEach(function(z){
    if (z[0] < lo || z[0] > hi) return;
    var y = Y(z[0]);
    s.push('<line x1="' + ML + '" y1="' + y.toFixed(1) + '" x2="' + (W-MR)
      + '" y2="' + y.toFixed(1) + '" stroke="var(--s1)" stroke-width="1.8"/>');
    s.push('<text x="' + (ML + 5) + '" y="' + (y-6).toFixed(1) + '" font-size="12.5"'
      + ' fill="var(--s1)" font-weight="600">' + z[1] + " " + pr(z[0]) + '</text>');
  });
  // marcas suyas
  marcas.forEach(function(mk){
    if (mk.v < lo || mk.v > hi) return;
    var y = Y(mk.v);
    s.push('<line x1="' + ML + '" y1="' + y.toFixed(1) + '" x2="' + (W-MR)
      + '" y2="' + y.toFixed(1) + '" stroke="var(--tinta)" stroke-width="1.4"'
      + ' stroke-dasharray="6 4"/>');
    s.push('<text x="' + (W-MR-6) + '" y="' + (y-6).toFixed(1) + '" font-size="12.5"'
      + ' fill="var(--tinta)" text-anchor="end" font-weight="600">' + pr(mk.v) + '</text>');
  });
  // sus entradas
  D.ops.forEach(function(op){
    var mn = +op.h.slice(0,2)*60 + +op.h.slice(3), i = mn - D.m0;
    if (i < i0 || i >= i1) return;
    var x = X(i), y = Y(D.c[i]);
    s.push('<line x1="' + x.toFixed(1) + '" y1="' + MT + '" x2="' + x.toFixed(1)
      + '" y2="' + (H-MB) + '" stroke="var(--s2)" stroke-width="1.6"/>');
    s.push('<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="7"'
      + ' fill="var(--panel)" stroke="var(--s2)" stroke-width="2.4"/>');
    s.push('<text x="' + (x+11).toFixed(1) + '" y="' + (y-11).toFixed(1)
      + '" font-size="13" fill="var(--s2)" font-weight="700">'
      + (op.lado > 0 ? "COMPRA" : "VENTA") + " " + op.h + '</text>');
  });
  // vela seleccionada
  if (sel >= i0 && sel < i1){
    s.push('<line x1="' + X(sel).toFixed(1) + '" y1="' + MT + '" x2="' + X(sel).toFixed(1)
      + '" y2="' + (H-MB) + '" stroke="var(--tinta2)" stroke-width="1" stroke-dasharray="3 3"/>');
  }
  $("#g").innerHTML = s.join("");
  $("#g").dataset.i0 = i0; $("#g").dataset.n = n;
  pintaLee(); pintaFicha();
}

function pintaLee(){
  var D = DIAS[iDia];
  var t = function(k, v, cl){ return '<div><div class="k">' + k + '</div><div class="v '
    + (cl||"") + '">' + v + "</div></div>"; };
  if (sel < 0){
    $("#lee").innerHTML = t("Máximo de Asia", pr(D.aHi)) + t("Mínimo de Asia", pr(D.aLo))
      + t("Vela", "—") + t("Toca una vela", "—");
    return;
  }
  var i = sel, dHi = (D.h[i] - D.aHi) * 10000, dLo = (D.l[i] - D.aLo) * 10000;
  $("#lee").innerHTML =
    t("Hora", hm(D.m0 + i), "ac") +
    t("Apertura", pr(D.o[i])) + t("Máximo", pr(D.h[i])) +
    t("Mínimo", pr(D.l[i])) + t("Cierre", pr(D.c[i])) +
    t("Al máx. de Asia", es(dHi,1) + " p", dHi > 0 ? "pos" : "neg") +
    t("Al mín. de Asia", es(dLo,1) + " p", dLo > 0 ? "pos" : "neg");
}

function pintaFicha(){
  var D = DIAS[iDia];
  var rh = -1, rl = -1;
  for (var i = 0; i < D.c.length; i++){
    var mn = D.m0 + i;
    if (mn < 480 || mn > 690) continue;
    if (rh < 0 && D.h[i] > D.aHi) rh = mn;
    if (rl < 0 && D.l[i] < D.aLo) rl = mn;
  }
  var txt = "<b>" + D.d + "</b> · rango de Asia <span class='mono'>" + pr(D.aLo)
    + " – " + pr(D.aHi) + "</span> (" + es((D.aHi-D.aLo)*10000,1) + " pips).<br>";
  txt += "En tu ventana " + (rh > 0 ? "<b>rompe el máximo a las " + hm(rh) + "</b>" : "no rompe el máximo")
    + " y " + (rl > 0 ? "<b>rompe el mínimo a las " + hm(rl) + "</b>" : "no rompe el mínimo") + ".<br>";
  if (D.ops.length){
    txt += "Tus operaciones: " + D.ops.map(function(o){
      return "<b>" + (o.lado > 0 ? "compra" : "venta") + " a las " + o.h + "</b>"
        + (o.rgo ? " <span class='mono'>(" + es(o.rgo,1) + " p de riesgo"
           + (o.res && o.res !== "?" ? ", " + o.res : "") + ")</span>" : "");
    }).join(" · ") + ".";
  } else {
    txt += "Ese día no tengo ninguna operación tuya apuntada.";
  }
  if (marcas.length){
    txt += "<br>Marcas: " + marcas.map(function(m){
      return "<span class='mono'>" + pr(m.v) + "</span>"; }).join(" · ");
    if (marcas.length >= 2){
      var a = marcas[marcas.length-2].v, b = marcas[marcas.length-1].v;
      txt += " — entre las dos últimas hay <b>" + es(Math.abs(a-b)*10000,1) + " pips</b>.";
    }
  }
  $("#ficha").innerHTML = txt;
}

$("#g").addEventListener("click", function(e){
  var D = DIAS[iDia], r = rango(D), i0 = r[0], i1 = r[1], n = i1 - i0;
  var box = this.getBoundingClientRect();
  var px = (e.clientX - box.left) / box.width * W;
  var i = i0 + Math.floor((px - ML) / ((W - ML - MR) / n));
  if (i >= i0 && i < i1){ sel = i; pinta(); }
});
$("#dias").addEventListener("click", function(e){
  var b = e.target.closest("button[data-i]"); if (!b) return;
  iDia = +b.dataset.i; sel = -1; marcas = []; pintaDias(); pinta();
});
$("#b-min").onclick = function(){
  if (sel < 0) return; marcas.push({v: DIAS[iDia].l[sel]}); pinta(); };
$("#b-max").onclick = function(){
  if (sel < 0) return; marcas.push({v: DIAS[iDia].h[sel]}); pinta(); };
$("#b-borra").onclick = function(){ marcas = []; pinta(); };
$("#b-zoom").onclick = function(){
  zoom = !zoom;
  this.setAttribute("aria-pressed", String(zoom));
  this.textContent = zoom ? "Ver 07:00-12:00" : "Ver sólo 08:00-11:30";
  pinta();
};

pintaDias(); pinta();
})();
</script>
